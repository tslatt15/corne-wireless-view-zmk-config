name: Build ZMK Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Firmware Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules
            tools
            zephyr
            bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Initialize workspace (West)
        uses: zmkfirmware/zmk-actions-toolkit@v2
        with:
          init_script: 'west init -l config'
          update_script: 'west update'

      - name: Compile Left Side
        uses: zmkfirmware/zmk-actions-toolkit@v2
        with:
          arguments: '--board nice_nano_v2 --shield "corne_left nice_view_mod"'

      - name: Compile Right Side
        uses: zmkfirmware/zmk-actions-toolkit@v2
        with:
          arguments: '--board nice_nano_v2 --shield "corne_right nice_view_mod"'

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Corne_BongoCat_Firmware
          path: build/zephyr/
          zmk.uf2
